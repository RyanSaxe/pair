<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" role="img" aria-label="A pair session: you ask, then work through rounds with feedback until something is understood, a plan is accepted, or the work is accepted">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;text-anchor:middle;font-size:15px}
.t{font-weight:600}.s{font-size:12.5px;fill:#59636e}.l{text-anchor:start}
.line{fill:none;stroke:#1f2328;stroke-width:1.5}.head{fill:#1f2328}
.box{fill:#ffffff;stroke:#b8bec6}.round{fill:#eef2fd;stroke:#3a5bd9}.side{fill:none;stroke:#8c959f;stroke-dasharray:4 3}.dash{fill:none;stroke:#8c959f;stroke-width:1.5;stroke-dasharray:4 4}
text{fill:#e6edf3}.s{fill:#9198a1}.line{stroke:#e6edf3}.head{fill:#e6edf3}.box{fill:#0d1117;stroke:#3d444d}.round{fill:#152042;stroke:#6e8cf0}.side{stroke:#656c76}.dash{stroke:#656c76}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect class="box" x="20" y="130" width="110" height="50" rx="10"/><text x="75" y="160" class="t">Ask</text>
<path class="line" d="M130 155 H186" marker-end="url(#a)"/>
<rect class="round" x="190" y="85" width="250" height="140" rx="70"/>
<text x="315" y="130" class="t">A round</text>
<text x="315" y="155" class="s">The agent publishes pages</text>
<text x="315" y="175" class="s">You choose, comment and ask</text>
<text x="315" y="195" class="s">in a thread, answered right away</text>
<path class="line" d="M370 225 C400 290 230 290 260 229" marker-end="url(#a)"/>
<text x="315" y="300" class="s">feedback: the next round answers it</text>
<rect class="side" x="200" y="18" width="110" height="42" rx="21"/><text x="255" y="44" class="s">Thread</text>
<path class="dash" d="M255 60 V83"/>
<rect class="side" x="320" y="18" width="110" height="42" rx="21"/><text x="375" y="44" class="s">Side work</text>
<path class="dash" d="M375 60 V83"/>
<rect class="box" x="500" y="50" width="140" height="50" rx="10"/><text x="570" y="80" class="t">Understood</text>
<rect class="box" x="500" y="130" width="140" height="50" rx="10"/><text x="570" y="160" class="t">Plan accepted</text>
<rect class="box" x="500" y="215" width="140" height="50" rx="10"/><text x="570" y="245" class="t">Work accepted</text>
<path class="line" d="M425 115 L496 80" marker-end="url(#a)"/>
<path class="line" d="M440 155 H496" marker-end="url(#a)"/>
<path class="line" d="M570 180 V211" marker-end="url(#a)"/>
<text x="580" y="200" class="s l">build rounds</text>
</svg>
