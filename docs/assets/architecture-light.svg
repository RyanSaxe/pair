<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 286" role="img" aria-label="pair architecture. Your agent CLI runs pair commands to build and publish round pages and replies to the local pair hub (127.0.0.1:4747). The hub serves the round UI to your browser, where you read pages and Agreed, pick options, leave notes, and start threads or proposals. When you send feedback or start a thread, the browser sends it to the hub, which wakes the holding agent through its CLI adapter. The hub reads and saves sessions, rounds, drafts, threads, and proposals under ~/.local/state/pair/.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;text-anchor:middle;font-size:15.5px}
.t{font-weight:600}.s{font-size:12.5px;fill:#59636e}.l{text-anchor:start}
.line{fill:none;stroke:#1f2328;stroke-width:1.5}.head{fill:#1f2328}
.bline{fill:none;stroke:#3a5bd9;stroke-width:1.5}.bhead{fill:#3a5bd9}
.box{fill:#ffffff;stroke:#b8bec6;stroke-width:1.5}.round{fill:#eef2fd;stroke:#3a5bd9;stroke-width:1.5}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="bhead"/></marker>
</defs>
<rect class="box" x="24" y="24" width="224" height="124" rx="10"/>
<text x="136" y="54" class="t">Your agent CLI</text>
<text x="136" y="78" class="s">runs pair commands</text>
<text x="136" y="98" class="s">builds &amp; publishes pages</text>
<text x="136" y="118" class="s">edits code once approved</text>
<rect class="round" x="348" y="24" width="224" height="124" rx="10"/>
<text x="460" y="54" class="t">pair hub</text>
<text x="460" y="78" class="s">local server · 127.0.0.1:4747</text>
<text x="460" y="98" class="s">serves rounds, drafts &amp; Work</text>
<text x="460" y="118" class="s">wakes holder via CLI adapter</text>
<rect class="box" x="672" y="24" width="224" height="124" rx="10"/>
<text x="784" y="54" class="t">Your browser</text>
<text x="784" y="78" class="s">reads round pages &amp; Agreed</text>
<text x="784" y="98" class="s">picks options · leaves notes</text>
<text x="784" y="118" class="s">starts threads &amp; proposals</text>
<path class="line" d="M248 62 H343" marker-end="url(#a)"/>
<text x="298" y="51" class="s">pages, replies</text>
<path class="bline" d="M348 110 H253" marker-end="url(#b)"/>
<text x="298" y="130" class="s">wake holder</text>
<path class="line" d="M572 62 H667" marker-end="url(#a)"/>
<text x="622" y="51" class="s">round UI</text>
<path class="bline" d="M672 110 H577" marker-end="url(#b)"/>
<text x="622" y="130" class="s">send, threads</text>
<path class="line" d="M460 153 V191" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="472" y="177" class="s l">read &amp; save</text>
<rect class="box" x="200" y="196" width="520" height="66" rx="10"/>
<text x="460" y="223" class="t">Local state on disk</text>
<text x="460" y="245" class="s">~/.local/state/pair/ · sessions, rounds, drafts, threads &amp; proposals</text>
</svg>
