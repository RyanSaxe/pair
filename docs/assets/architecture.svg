<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" role="img" aria-label="What runs where: your agent CLI, the pair hub on your machine, and your browser">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;text-anchor:middle;font-size:15px}
.t{font-weight:600}.s{font-size:12.5px;fill:#59636e}.l{text-anchor:start}
.line{fill:none;stroke:#1f2328;stroke-width:1.5}.head{fill:#1f2328}
.box{fill:#ffffff;stroke:#b8bec6}.round{fill:#eef2fd;stroke:#3a5bd9}.side{fill:none;stroke:#8c959f;stroke-dasharray:4 3}.dash{fill:none;stroke:#8c959f;stroke-width:1.5;stroke-dasharray:4 4}
@media (prefers-color-scheme:dark){text{fill:#e6edf3}.s{fill:#9198a1}.line{stroke:#e6edf3}.head{fill:#e6edf3}.box{fill:#0d1117;stroke:#3d444d}.round{fill:#152042;stroke:#6e8cf0}.side{stroke:#656c76}.dash{stroke:#656c76}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect class="box" x="20" y="70" width="160" height="80" rx="10"/><text x="100" y="104" class="t">Your agent CLI</text><text x="100" y="126" class="s">runs pair commands</text>
<rect class="round" x="250" y="70" width="160" height="80" rx="10"/><text x="330" y="104" class="t">pair hub</text><text x="330" y="126" class="s">on your machine</text>
<rect class="box" x="480" y="70" width="160" height="80" rx="10"/><text x="560" y="104" class="t">Your browser</text><text x="560" y="126" class="s">you read and respond</text>
<path class="line" d="M180 92 H246" marker-end="url(#a)"/><text x="215" y="60" class="s">pages, replies</text>
<path class="line" d="M250 130 H184" marker-end="url(#a)"/><text x="215" y="172" class="s">wake</text>
<path class="line" d="M410 92 H476" marker-end="url(#a)"/><text x="445" y="60" class="s">pages</text>
<path class="line" d="M480 130 H414" marker-end="url(#a)"/><text x="445" y="172" class="s">feedback, threads</text>
<text x="330" y="212" class="s">The hub keeps each session, its rounds and its side work on disk</text>
</svg>
