<!-- A proposed change. Add data-wrap to the section to wrap long lines, such as the prose of a Markdown file, instead of scrolling them. -->
<section class="change-review" data-kind="diff">
  <div class="change-controls">
    <span class="change-layout" role="group" aria-label="Layout">
      <button type="button" data-diff-style="split">Side by side</button>
      <button type="button" data-diff-style="unified">Unified</button>
    </span>
    <button class="change-wrap" type="button" data-diff-wrap>Wrap</button>
  </div>
  <textarea data-diff-input="OUTPUT.json" hidden></textarea>
  <div class="change-view" aria-label="Before and proposed changes"></div>
  <p class="renderer-error" data-diff-error hidden></p>
  <details class="change-source">
    <summary>Exact source and Git patch</summary>
    <h3>Before</h3>
    <pre data-diff-source="before"></pre>
    <h3>Proposed</h3>
    <pre data-diff-source="after"></pre>
    <h3>Git patch</h3>
    <pre data-diff-source="patch"></pre>
  </details>
</section>

<!-- For diagrams or other visual changes, use this pair and the legend after
     it instead of the text viewer. -->
<section class="change-pair" data-kind="pair of diagrams">
  <section>
    <header>Before <span>− Removed or replaced</span></header>
    <div class="change-content">
      <!-- Before HTML or Mermaid with removed/changed classes. -->
    </div>
  </section>
  <section>
    <header>Proposed <span>+ Added or changed</span></header>
    <div class="change-content">
      <!-- Proposed HTML or Mermaid with added/changed classes. -->
    </div>
  </section>
</section>
<div class="change-key">
  <span>− Describe what is removed</span><span>+ Describe what is added</span>
</div>
