<!-- Two or three options with matched sections -->
<section
  class="comparison"
  data-choice="DECISION_ID"
  data-label="Decision label"
>
  <article class="comparison-option">
    <header>
      <h2>First option</h2>
      <p>Proposal and its distinguishing consequence.</p>
    </header>
    <section class="comparison-content">
      <!-- Insert rich HTML. Repeat matched sections in each option to align them. -->
    </section>
    <footer>
      <button
        class="btn comparison-pick"
        data-value="FIRST_OPTION_ID"
        data-label="First option"
      >
        Choose option
      </button>
    </footer>
  </article>
  <article class="comparison-option">
    <header>
      <h2>Second option</h2>
      <p>Proposal and its distinguishing consequence.</p>
    </header>
    <section class="comparison-content">
      <!-- The same sections as the first option, in the same order. -->
    </section>
    <footer>
      <button
        class="btn comparison-pick"
        data-value="SECOND_OPTION_ID"
        data-label="Second option"
      >
        Choose option
      </button>
    </footer>
  </article>
  <!-- Copy an article for a third option. Keep decision and option IDs stable. -->
</section>
