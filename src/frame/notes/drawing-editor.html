<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/dev/index.css"
    />
    <script>
      window.EXCALIDRAW_ASSET_PATH =
        "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/";
      // Until Excalidraw draws, paintTheme fills the page with the color
      // that Excalidraw gives a white canvas in the frame's theme.
      window.drawingTheme = __DRAWING_THEME__;
      function paintTheme() {
        document.documentElement.style.colorScheme = drawingTheme;
        document.documentElement.style.background =
          drawingTheme === "dark" ? "#121212" : "#ffffff";
      }
      paintTheme();
    </script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.0.0",
          "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
          "react-dom": "https://esm.sh/react-dom@19.0.0",
          "react-dom/client": "https://esm.sh/react-dom@19.0.0/client"
        }
      }
    </script>
    <style>
      html,
      body,
      #canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      #canvas .excalidraw {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="canvas"></div>
    <script type="module">
      import React from "https://esm.sh/react@19.0.0";
      import { createRoot } from "https://esm.sh/react-dom@19.0.0/client";
      import {
        Excalidraw,
        convertToExcalidrawElements,
        exportToBlob,
      } from "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/dev/index.js?external=react,react-dom";

      const converter =
        "https://esm.sh/@excalidraw/mermaid-to-excalidraw@3.1.0";
      const nonce = __DRAWING_NONCE__;
      /* The canvas background is white in both themes. Excalidraw's dark
         theme inverts the canvas colors on screen, and exportToBlob saves
         the PNG in the light colors. */
      let draft = {
        elements: [],
        appState: { viewBackgroundColor: "#ffffff" },
        files: {},
      };
      const send = (type, extra = {}) =>
        parent.postMessage({ type, nonce, ...extra }, "*");
      // Excalidraw calls onChange on a scroll or a selection too. It raises an
      // element's version on each edit to the element, so the background and
      // the sum of the versions change only when the drawing changes. onChange
      // sends the frame a change only then, and never while convert() draws a
      // diagram.
      const version = ({ elements, appState }) =>
        `${appState.viewBackgroundColor} ${elements.reduce(
          (sum, element) => sum + element.version,
          0,
        )}`;
      let sent;
      let converting = false;
      let root;
      let api;
      const editor = new Promise((resolve) => (api = resolve));
      function render() {
        root.render(
          React.createElement(Excalidraw, {
            initialData: draft,
            theme: drawingTheme,
            excalidrawAPI: api,
            onChange: (elements, appState, files) => {
              draft = {
                elements: [...elements],
                appState: {
                  viewBackgroundColor: appState.viewBackgroundColor,
                },
                files,
              };
              if (converting) sent = version(draft);
              if (version(draft) === sent) return;
              sent = version(draft);
              send("change", {
                scene: {
                  ...draft,
                  elements: draft.elements.filter(
                    (element) => !element.isDeleted,
                  ),
                },
              });
            },
            UIOptions: {
              canvasActions: {
                saveToActiveFile: false,
                loadScene: false,
                export: false,
              },
            },
          }),
        );
      }
      /* The converter sizes each box for Excalifont, which Excalidraw adds
         to the document only once a scene uses it. With another font's
         sizes, Excalidraw cuts letters off each label, so convert draws one
         hidden text element and waits for Excalifont before converting. A
         font that failed to load stays failed, so when document.fonts.load
         rejects, convert stops waiting and uses the fallback font. */
      async function convert(source) {
        const [{ parseMermaidToExcalidraw }, ready] = await Promise.all([
          import(converter),
          editor,
        ]);
        ready.updateScene({
          elements: convertToExcalidrawElements([
            { type: "text", x: 0, y: 0, text: "Aa", opacity: 0 },
          ]),
        });
        for (let tries = 0; tries < 100; tries++) {
          await new Promise((resolve) => setTimeout(resolve, 50));
          const faces = await document.fonts
            .load("16px Excalifont")
            .catch(() => null);
          if (!faces || faces.length) break;
        }
        const { elements, files } = await parseMermaidToExcalidraw(source, {
          themeVariables: { fontSize: "16px" },
        });
        if (files) ready.addFiles(Object.values(files));
        ready.updateScene({ elements: convertToExcalidrawElements(elements) });
        ready.scrollToContent(undefined, { fitToContent: true });
      }
      addEventListener("message", async (event) => {
        if (event.source !== parent || event.data?.nonce !== nonce) return;
        if (event.data.type === "theme") {
          window.drawingTheme = event.data.theme;
          paintTheme();
          if (root) render();
        }
        if (event.data.type === "init") {
          const { scene, source, fit } = event.data;
          if (scene)
            draft = {
              elements: scene.elements,
              appState: scene.appState,
              files: scene.files,
            };
          sent = version(draft);
          root = createRoot(document.getElementById("canvas"));
          converting = !scene && Boolean(source);
          render();
          if (converting)
            try {
              await convert(source);
            } catch (error) {
              send("error", {
                message: `Could not turn the diagram into a drawing: ${error.message}`,
              });
              // This removes the hidden text element, so the reviewer starts
              // from an empty canvas.
              (await editor).updateScene({ elements: [] });
            } finally {
              converting = false;
            }
          // Excalidraw loads initialData after the first render, so the
          // editor waits for the elements before scrolling them into view.
          else if (fit) {
            const ready = await editor;
            for (let frame = 0; frame < 100; frame++) {
              if (ready.getSceneElements().length) break;
              await new Promise(requestAnimationFrame);
            }
            ready.scrollToContent(undefined, { fitToContent: true });
          }
        }
        if (event.data.type === "save") {
          try {
            if (!draft.elements.some((element) => !element.isDeleted))
              throw new Error("Draw something before saving.");
            const blob = await exportToBlob({
              ...draft,
              mimeType: "image/png",
            });
            const png = await blob.arrayBuffer();
            send("saved", {
              scene: {
                type: "excalidraw",
                version: 2,
                source: "pair",
                ...draft,
              },
              png,
            });
          } catch (error) {
            send("error", { message: error.message });
          }
        }
      });
      send("ready");
    </script>
  </body>
</html>
