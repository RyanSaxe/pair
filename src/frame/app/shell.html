<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>pair</title>
    <!-- assets/icon.svg, inline because a page is one self-contained file -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cg transform='translate(-66.05 -24.56) scale(1.3416)'%3E%3Cpath fill='%234d6ef2' transform='translate(55.92 104) scale(0.07 -0.07)' d='M224 -11Q170 -11 127.0 10.0Q84 31 60.0 67.0Q36 103 36 148Q36 202 64.0 233.5Q92 265 155.0 278.5Q218 292 322 292H375V214H323Q272 214 240.5 208.5Q209 203 195.5 190.0Q182 177 182 154Q182 126 201.5 108.0Q221 90 258 90Q287 90 309.5 103.5Q332 117 345.0 140.5Q358 164 358 194V309Q358 353 338.0 371.5Q318 390 270 390Q243 390 211.5 383.5Q180 377 142 362Q120 352 103.0 357.5Q86 363 77.0 377.5Q68 392 68.0 409.5Q68 427 78.0 443.5Q88 460 111 468Q158 487 199.5 494.0Q241 501 276 501Q353 501 402.5 478.5Q452 456 477.0 409.5Q502 363 502 290V68Q502 31 484.0 11.0Q466 -9 432 -9Q398 -9 379.5 11.0Q361 31 361 68V105L368 99Q362 65 342.5 40.5Q323 16 293.0 2.5Q263 -11 224 -11Z'/%3E%3Cpath fill='%234d6ef2' transform='translate(96.02 104) scale(0.07 -0.07)' d='M134 -8Q97 -8 77.5 13.5Q58 35 58 74V416Q58 456 77.5 477.5Q97 499 134 499Q170 499 189.5 477.5Q209 456 209 416V74Q209 35 190.0 13.5Q171 -8 134 -8Z'/%3E%3Cg transform='rotate(-10 105.64 64.07)'%3E%3Cpath d='M99.3 24.9H121.19A8.64 8.64 0 0 1 129.83 33.54V45.06A8.64 8.64 0 0 1 121.19 53.7H111.11L105.64 64.07L101.89 53.7H99.3A8.64 8.64 0 0 1 90.66 45.06V33.54A8.64 8.64 0 0 1 99.3 24.9Z' fill='%234d6ef2'/%3E%3Cpath d='M106.36 34.81L101.43 39.3L106.36 43.8M114.13 34.81L119.06 39.3L114.13 43.8M111.97 33.6L108.52 45.01' stroke='%23ffffff' fill='none' stroke-width='2.02' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"
    />
    <!-- FRAME_STYLE -->
    <!-- A sidebar closed in this browser starts closed, before the first
         paint, so it never slides out as the page opens. sidebar.mjs keeps
         the state from here on, under the same key. -->
    <script>
      try {
        if (localStorage.getItem("pair:sidebar") === "closed")
          document.documentElement.dataset.sidebar = "closed";
      } catch {}
    </script>
  </head>
  <body>
    <div class="app" id="app">
      <header class="frame-header" id="frame-header">
        <button
          class="icon-btn"
          id="sidebar-toggle"
          type="button"
          aria-label="Sidebar"
          aria-controls="sidebar"
          aria-expanded="true"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="4" width="18" height="16" rx="2.5" />
            <path d="M9.5 4v16" />
          </svg>
        </button>
        <!-- The session list opens under this button at every width. -->
        <button
          class="icon-btn menu"
          id="menu-button"
          type="button"
          aria-label="Sessions"
          aria-expanded="false"
          popovertarget="sessions-pop"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="2.5" y="2.5" width="19" height="19" rx="3.5" />
            <path d="M7 9h10M7 13h10M7 17h6" />
          </svg>
          <b id="sessions-count" aria-hidden="true" hidden></b>
        </button>
        <button
          class="icon-btn"
          id="round"
          type="button"
          aria-haspopup="dialog"
          aria-label="Rounds"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3.2 12a8.8 8.8 0 1 0 2.6-6.2" />
            <path d="M3.2 3.4v4.4h4.4" />
            <path d="M12 7.3V12l3.5 2.1" />
          </svg>
        </button>
        <button
          class="icon-btn"
          id="settings"
          type="button"
          aria-label="Settings"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
            />
          </svg>
        </button>
        <button
          class="bell"
          id="bell"
          type="button"
          aria-label="Notifications"
          aria-expanded="false"
          popovertarget="center-pop"
          hidden
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
            <path d="M10 21a2 2 0 0 0 4 0" />
          </svg>
          <b id="bell-count"></b>
        </button>
        <span class="spacer"></span>
        <button
          class="btn primary header-submit"
          id="submit"
          type="button"
          disabled
        >
          Send feedback
        </button>
      </header>
      <div class="app-body">
        <!-- At 720px and below this dims the page under the open sidebar,
             and a tap on it closes the sidebar. -->
        <div class="sidebar-scrim" id="sidebar-scrim"></div>
        <aside class="sidebar" id="sidebar">
          <div class="side-label">
            <span>Pages</span
            ><span class="round-status idle" data-round-status
              ><i></i><span></span
            ></span>
          </div>
          <div class="pages-slot">
            <nav id="navigation" aria-label="Plan pages"></nav>
          </div>
        </aside>
        <!-- The strip sits above the scrolling column, so the scrollbar
             starts below it. -->
        <div class="main-column">
          <div class="history-strip" id="history-strip" hidden>
            <span id="history-label"></span>
            <button type="button" id="history-return"></button>
          </div>
          <main>
            <div class="content" id="content">
              <div class="save-error" id="save-error" role="alert" hidden>
                <span id="save-error-text"></span>
                <button
                  type="button"
                  id="save-error-dismiss"
                  aria-label="Dismiss error"
                >
                  ×
                </button>
              </div>
              <button
                class="comment-here"
                id="comment-here"
                type="button"
                aria-keyshortcuts="c"
                hidden
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M20.5 11.5a8 8 0 0 1-11.7 7.1L3.5 20l1.4-4.6a8 8 0 1 1 15.6-3.9z"
                  />
                </svg>
                <span class="comment-label"
                  ><span></span><kbd aria-hidden="true">c</kbd></span
                >
              </button>
              <section id="reading">
                <h1 tabindex="-1" id="page-title"></h1>
                <p class="home-agent" id="home-agent" hidden></p>
                <div class="agent-activity" id="agent-activity" hidden>
                  <div class="activity-heading">
                    <strong id="activity-title"></strong>
                    <time id="activity-elapsed"></time>
                  </div>
                  <p id="activity-summary"></p>
                  <div
                    class="activity-segments"
                    id="activity-segments"
                    aria-hidden="true"
                  ></div>
                  <div class="activity-pages" id="activity-pages"></div>
                  <div class="activity-footer" id="activity-footer">
                    <button
                      class="btn"
                      id="activity-message"
                      type="button"
                      aria-describedby="activity-message-tip"
                    >
                      Message the agent
                    </button>
                    <span
                      class="thread-tip"
                      id="activity-message-tip"
                      role="tooltip"
                    ></span>
                  </div>
                  <div id="activity-handoff" hidden></div>
                </div>
                <p class="finished-line" id="finished-line" hidden></p>
                <div class="note-bars" id="note-bars"></div>
                <div class="chosen-bar" id="chosen-bar" hidden></div>
                <div id="page-content"></div>
                <section
                  class="sent-page-comments"
                  id="sent-page-comments"
                  hidden
                ></section>
                <p class="note-count" id="note-count" hidden></p>
                <nav class="page-footer" aria-label="Previous and next">
                  <a id="footer-previous" hidden></a>
                  <a id="footer-next" hidden></a>
                </nav>
              </section>
              <!-- The address names Review #feedback and Work #work, and no
                   element has either ID, because once a page loads, the
                   browser scrolls to the element whose ID the address's #
                   part names and focuses it. -->
              <section id="review-view" hidden>
                <h1 tabindex="-1" id="feedback-title">Review</h1>
                <section class="sent-feedback" id="sent-feedback" hidden>
                  <h2>Your feedback</h2>
                  <div id="sent-feedback-list"></div>
                </section>
                <div id="feedback-review">
                  <div class="draft-head" id="draft-head" hidden>
                    <h2>Your feedback</h2>
                    <span id="draft-count"></span>
                  </div>
                  <p
                    class="notice"
                    id="submit-error"
                    data-tone="danger"
                    role="alert"
                    hidden
                  ></p>
                  <div id="feedback-groups"></div>
                  <section class="feedback-group" id="overall-group" hidden>
                    <div class="group-head">
                      <h2>Overall</h2>
                    </div>
                    <div id="overall-notes"></div>
                  </section>
                  <div class="feedback-end">
                    <button class="btn quiet" id="export" type="button">
                      Export copy
                    </button>
                  </div>
                  <p class="small" id="storage-status"></p>
                  <p class="small" id="connection-status"></p>
                </div>
                <!-- The threads on the overall comment, before and after the
                     round's feedback is sent. -->
                <div class="end-threads" id="overall-threads"></div>
                <nav class="page-footer" aria-label="Pages">
                  <button id="feedback-pages" type="button">Pages →</button>
                </nav>
              </section>
              <!-- Every proposal of the session, in four tabs. The frame
                   draws the tabs and the cards. -->
              <section id="work-view" hidden>
                <h1 tabindex="-1" id="work-title">Work</h1>
                <p
                  class="notice"
                  id="work-error"
                  data-tone="danger"
                  role="alert"
                  hidden
                ></p>
                <div
                  class="work-tabs"
                  id="work-tabs"
                  role="tablist"
                  aria-label="Work"
                ></div>
                <div class="work-cards" id="work-cards" role="tabpanel"></div>
                <!-- The threads on Work as a whole, on every tab. -->
                <div class="end-threads" id="work-threads"></div>
              </section>
            </div>
          </main>
        </div>
      </div>
    </div>
    <!-- DIALOGS -->
    <script type="application/json" id="drawing-editor-source">
      <!-- DRAWING_EDITOR -->
    </script>
    <div class="note-tip" id="note-tip" hidden></div>

    <script type="application/json" id="session-config">
      {}
    </script>
    <script type="application/json" id="plan-data">
      {}
    </script>
    <!-- FRAME_SCRIPT -->
    <!-- CUSTOM_SCRIPT -->
  </body>
</html>
