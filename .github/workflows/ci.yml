name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # main's ruleset requires the Ubuntu jobs by the names test (20.1.0),
    # test (20) and test (24), so they keep them, and the macOS job adds its
    # platform to its name.
    name: ${{ matrix.os == 'ubuntu-latest' && format('test ({0})', matrix.node) || format('test ({0}, {1})', matrix.os, matrix.node) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # The oldest Node pair supports, the latest Node 20, and the current
        # LTS.
        node: [20.1.0, 20, 24]
        # macOS limits socket paths to 104 bytes and puts temporary
        # directories under long /var/folders paths, and Windows has named
        # pipes instead of socket files and runs only files with an
        # executable extension, so the suite runs on both too, on the current
        # LTS.
        include:
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  # The browser tests drive the runner image's Google Chrome. The landing
  # tests also drive WebKit, which Playwright installs, with the system
  # libraries it needs, for the playwright-core version that npm ci installs.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright-core install --with-deps webkit
      - run: npm run test:browser

  # Every figure in the test fixture, in the light and dark themes. A figure
  # whose library loads from esm.sh or jsDelivr fails this job while that CDN
  # is down.
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:figures

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx --yes prettier@3.9.6 --check .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # eslint.config.mjs fails a file over 1000 lines. The second run lists
      # each file over 500 as a warning and does not fail.
      - run: npx --yes eslint@10.11.0 .
      - run: |
          npx --yes eslint@10.11.0 --rule '{"max-lines": ["warn", 500]}' .
