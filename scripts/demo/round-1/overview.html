<section class="decision" data-choice="start" data-label="Where a thread starts">
  <h3>Where does the reviewer start a thread?</h3>
  <button
    class="decision-option"
    type="button"
    data-value="note-dialog"
    data-label="In the note dialog"
  >
    <b>In the note dialog <span class="tag">Recommended</span></b>
    <p>
      Start a thread sits beside Add to feedback, so any note can go to the
      agent at once.
    </p>
  </button>
  <button
    class="decision-option"
    type="button"
    data-value="block-button"
    data-label="A button per block"
  >
    <b>A button on every block</b>
    <p>Every block gets a second control next to the comment button.</p>
  </button>
</section>

<h3>What a reply holds</h3>
<!-- The screenshot script selects words in this paragraph, so it stays on
     one line. -->
<p>The agent writes a reply the way it writes a page, so a reply can show code, a diff or a diagram.</p>
