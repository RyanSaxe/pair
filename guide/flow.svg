<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 300" role="img" aria-labelledby="flowTitle flowDesc"><title id="flowTitle">Working in pair</title><desc id="flowDesc">A session can explain, decide, plan and build, in any order, and every round goes through the same loop. Work you start can run in a sub-session beside it, with the same loop of its own.</desc><style>
.flow-bg{fill:var(--panel,#ffffff)}
.flow-box{fill:var(--panel,#ffffff);stroke:var(--line,#d0d7de);stroke-width:1.5}
.flow-key{fill:var(--accent-soft,#eef2fd);stroke:var(--accent,#3457d5);stroke-width:1.5}
.flow-label{fill:var(--ink,#1f2328);font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}
.flow-sub{fill:var(--muted,#59636e);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}
.flow-line{fill:none;stroke:var(--muted,#59636e);stroke-width:1.5;marker-end:url(#flowArrow)}
.flow-link{fill:none;stroke:var(--accent,#3457d5);stroke-width:1.5;stroke-dasharray:5 5;marker-end:url(#flowArrowAcc)}
.flow-head{fill:var(--muted,#59636e)}.flow-head-acc{fill:var(--accent,#3457d5)}
@media (prefers-color-scheme: dark){
.flow-bg,.flow-box{fill:var(--panel,#0d1117)}.flow-box{stroke:var(--line,#3d444d)}
.flow-key{fill:var(--accent-soft,#152042);stroke:var(--accent,#8fa5ff)}
.flow-label{fill:var(--ink,#e6edf3)}.flow-sub{fill:var(--muted,#9198a1)}
.flow-line{stroke:var(--muted,#9198a1)}.flow-head{fill:var(--muted,#9198a1)}
.flow-link{stroke:var(--accent,#8fa5ff)}.flow-head-acc{fill:var(--accent,#8fa5ff)}}
.flow-chip{fill:var(--panel,#ffffff);stroke:var(--accent,#3457d5);stroke-width:1.5}
.flow-group{fill:none;stroke:var(--line,#d0d7de);stroke-width:1.5;stroke-dasharray:4 4}
@media (prefers-color-scheme: dark){.flow-chip{fill:var(--panel,#0d1117);stroke:var(--accent,#8fa5ff)}.flow-group{stroke:var(--line,#3d444d)}}
</style><defs><marker id="flowArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" class="flow-head"/></marker><marker id="flowArrowAcc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" class="flow-head-acc"/></marker></defs><rect class="flow-bg" width="910" height="300"/>
<text class="flow-sub" x="320" y="22">A session can do any of these, in any order</text>
<rect class="flow-chip" x="20.0" y="34" width="138.0" height="58" rx="22"/><text class="flow-label" x="89.0" y="59.0">Explain</text><text class="flow-sub" x="89.0" y="79.0">code or an idea</text>
<path class="flow-link" d="M89.0 92 V130"/>
<rect class="flow-chip" x="174.0" y="34" width="138.0" height="58" rx="22"/><text class="flow-label" x="243.0" y="59.0">Decide</text><text class="flow-sub" x="243.0" y="79.0">between options</text>
<path class="flow-link" d="M243.0 92 V130"/>
<rect class="flow-chip" x="328.0" y="34" width="138.0" height="58" rx="22"/><text class="flow-label" x="397.0" y="59.0">Plan</text><text class="flow-sub" x="397.0" y="79.0">the work</text>
<path class="flow-link" d="M397.0 92 V130"/>
<rect class="flow-chip" x="482.0" y="34" width="138.0" height="58" rx="22"/><text class="flow-label" x="551.0" y="59.0">Build</text><text class="flow-sub" x="551.0" y="79.0">the change</text>
<path class="flow-link" d="M551.0 92 V130"/>
<rect class="flow-group" x="20" y="134" width="600" height="150" rx="12"/>
<text class="flow-label" x="320.0" y="160">Every round</text>
<rect class="flow-box" x="40.0" y="184" width="166.66666666666666" height="64" rx="8"/><text class="flow-label" x="123.33333333333333" y="212.0">Agent publishes</text><text class="flow-sub" x="123.33333333333333" y="232.0">pages</text>
<path class="flow-line" d="M206.66666666666666 216 H232.66666666666666"/>
<rect class="flow-box" x="236.66666666666666" y="184" width="166.66666666666666" height="64" rx="8"/><text class="flow-label" x="320.0" y="212.0">You review</text><text class="flow-sub" x="320.0" y="232.0">comment, choose, ask</text>
<path class="flow-line" d="M403.3333333333333 216 H429.3333333333333"/>
<rect class="flow-box" x="433.3333333333333" y="184" width="166.66666666666666" height="64" rx="8"/><text class="flow-label" x="516.6666666666666" y="222.0">Send feedback</text>
<path class="flow-line" d="M516.6666666666666 248 V270 H123.33333333333333 V252"/>
<path class="flow-link" d="M620 209 H656"/>
<text class="flow-sub" x="638" y="200">Start</text>
<rect class="flow-group" x="660" y="134" width="230" height="150" rx="12"/>
<text class="flow-label" x="775" y="160">A sub-session</text>
<rect class="flow-box" x="678" y="184" width="88" height="50" rx="8"/><text class="flow-label" x="722.0" y="215.0">Pages</text>
<rect class="flow-box" x="792" y="184" width="88" height="50" rx="8"/><text class="flow-label" x="836.0" y="215.0">Feedback</text>
<path class="flow-line" d="M766 202 H788"/>
<path class="flow-line" d="M792 218 H770"/>
<text class="flow-sub" x="775" y="262">the same loop, beside it</text>
</svg>
